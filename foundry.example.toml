schema_version = 1

[foundry]
workspace_root = "C:/dev/VandrelFoundryWorkspace"
asset_library_root = "C:/dev/VandrelAssetLibrary"
default_provider = "meshy"

[vandrel]
reference_repo_root = "C:/dev/Vandrel"
required_marker = "project.godot"
write_enabled = false

[providers.meshy]
api_base = "https://api.meshy.ai"
api_key_environment_variable = "MESHY_API_KEY"
poll_interval_seconds = 10
request_timeout_seconds = 60
maximum_download_bytes = 4000000000

[release]
default_dry_run = true
allow_overwrite = false

[tools]
godot_executable = "C:/Dev/Godot/Godot.exe"
blender_executable = "C:/Program Files (x86)/Steam/steamapps/common/Blender/blender.exe"
godot_timeout_seconds = 120
blender_timeout_seconds = 300
maximum_output_bytes = 1000000
