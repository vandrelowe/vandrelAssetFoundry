[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vandrel-asset-foundry"
version = "0.3.0"
description = "Manifest-first local asset workflow for Vandrel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.22,<5",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
foundry = "vandrel_foundry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vandrel_foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live_tool: opt-in local external-tool smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
